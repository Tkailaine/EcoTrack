spring.application.name=EcoTrack

# Força o Flyway a entender que o banco antigo para na versão 0, logo a V1 precisa rodar
spring.flyway.baseline-version=0

# Configurações de Conexão com o Oracle FIAP
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:RM561324}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:021206}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Configurações do Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Configurações do Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true