version: '3.8'

services:
  ecotrack:
    build: .
    container_name: ecotrack-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
    volumes:
      - app-logs:/app/logs
    networks:
      - ecotrack-network
    restart: unless-stopped

volumes:
  app-logs:

networks:
  ecotrack-network:
    driver: bridge